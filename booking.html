<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>S Trans Booking Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css"> <!-- reuse your existing styles -->
  <style>
    /* Extra styling just for the booking page button */
    .login-container {
      text-align: center;
      padding: 4rem 2rem;
    }
    .login-container h1 {
      font-size: 2rem;
      color: var(--navy);
      margin-bottom: 1.5rem;
    }
    .login-btn {
      display: inline-block;
      background-color: #f57c00;
      color: #fff;
      padding: 1rem 2rem;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.2rem;
      transition: background-color 0.3s ease;
    }
    .login-btn:hover {
      background-color: #e65100;
    }
  </style>
</head>
<body>
  <!-- Header placeholder -->
  <div id="header"></div>
  <script src="header.js"></script>

  <div class="login-container">
    <h1>This is for official login of S Trans Booking.</h1>
    <a href="https://transport-management.streamlit.app/" target="_blank" class="login-btn">
      Go to Application
    </a>
  </div>

  <!-- Footer placeholder -->
  <div id="footer"></div>
  <script src="footer.js"></script>
</body>
</html>
