<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Services Tabs Test</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .tab { padding: 10px; background: #0a1f44; color: #fff; cursor: pointer; }
    .tab.active { background: #f57c00; }
    .tab-content { display: none; padding: 20px; background: #f5f5f5; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" data-tab="one">One</button>
    <button class="tab" data-tab="two">Two</button>
  </div>

  <div class="tab-content active" id="one">
    <p>Content for One</p>
  </div>
  <div class="tab-content" id="two">
    <p>Content for Two</p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const tabs = document.querySelectorAll(".tab");
      const contents = document.querySelectorAll(".tab-content");

      tabs.forEach(tab => {
        tab.addEventListener("click", () => {
          tabs.forEach(t => t.classList.remove("active"));
          contents.forEach(c => c.classList.remove("active"));
          tab.classList.add("active");
          document.getElementById(tab.dataset.tab).classList.add("active");
        });
      });
    });
  </script>
</body>
</html>
