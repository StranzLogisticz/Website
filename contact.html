<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Stranz Logistics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <div id="header"></div>
  <script src="header.js"></script>

  <!-- Hero Banner -->
  <section class="contact-hero">
    <h1>Contact Us</h1>
    <p>We’re here to help you move forward</p>
  </section>

  <!-- Contact Info Cards (Clickable) -->
  <section class="contact-info">
    <a href="https://wa.me/919566952888" target="_blank" class="info-card">
      <h3>📞 Phone</h3>
      <p>+91 95669 52888</p>
    </a>
    <a href="mailto:info@stranz.in" class="info-card">
      <h3>✉️ Email</h3>
      <p>info@stranz.in</p>
    </a>
    <a href="https://maps.google.com/?q=Chennai+HQ+Tamil+Nadu+India" target="_blank" class="info-card">
      <h3>📍 Address</h3>
      <p>Chennai HQ, Tamil Nadu, India</p>
    </a>
  </section>

  <!-- Contact Form -->
  <section class="contact-form">
    <h2 class="section-title">Get in Touch</h2>
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <input type="text" placeholder="Company Name" required>
      <input type="tel" placeholder="Phone Number" required>
      <textarea placeholder="Message" rows="5" required></textarea>
      <button type="submit" class="btn-submit">Send Message</button>
    </form>
  </section>
<!-- Social Ribbon -->
<section class="social-ribbon">
  <div class="ribbon-content">
    <h2>Follow us on</h2>
    <div class="social-icons">
      <a href="https://www.linkedin.com/company/stranz" target="_blank" class="social-link">🔗 LinkedIn</a>
      <a href="https://www.facebook.com/stranz" target="_blank" class="social-link">📘 Facebook</a>
      <a href="https://www.instagram.com/stranz" target="_blank" class="social-link">📸 Instagram</a>
      <a href="https://twitter.com/stranz" target="_blank" class="social-link">🐦 X</a>
    </div>
  </div>
</section>
  <!-- Footer -->
  <div id="footer"></div>
  <script src="footer.js"></script>

</body>
</html>
