<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Stranz Logistics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --navy: #0a1f44;
      --orange: #f57c00;
      --light-gray: #f4f7f9;
      --border: #e0e0e0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--light-gray);
      color: var(--navy);
      margin: 0;
    }

    /* Hero Section */
    .contact-hero {
      background: linear-gradient(rgba(10, 31, 68, 0.85), rgba(10, 31, 68, 0.85)), 
                  url('assets/img/contact-bg.jpg') center/cover;
      color: white;
      text-align: center;
      padding: 5rem 1rem;
    }

    .contact-hero h1 { font-size: 2.5rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }

    /* Main Container Layout */
    .contact-container {
      max-width: 1100px;
      margin: -4rem auto 4rem;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 0 1rem;
    }

    /* Sidebar Styling */
    .contact-sidebar {
      flex: 1;
      min-width: 300px;
      background: var(--navy);
      color: white;
      padding: 3rem 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .sidebar-item { margin-bottom: 2rem; }
    .sidebar-item h3 { color: var(--orange); font-size: 1.1rem; margin-bottom: 10px; text-transform: uppercase; }
    .sidebar-item p { line-height: 1.6; opacity: 0.9; margin: 0; }
    .sidebar-item a { color: white; text-decoration: none; transition: color 0.3s; }
    .sidebar-item a:hover { color: var(--orange); }

    /* Form Card Styling */
    .form-card {
      flex: 2;
      min-width: 320px;
      background: white;
      padding: 3rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .form-card h2 { margin-bottom: 1.5rem; font-size: 1.8rem; border-left: 5px solid var(--orange); padding-left: 15px; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .full-width { grid-column: span 2; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; color: #555; }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
      transition: all 0.3s;
      background-color: #fff;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(245, 124, 0, 0.1);
    }

    .btn-submit {
      background: var(--orange);
      color: white;
      border: none;
      padding: 16px 30px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-submit:hover {
      background: #e65100;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(230, 81, 0, 0.3);
    }

    /* Social Ribbon */
    .social-ribbon { background: #fff; padding: 2rem 0; text-align: center; border-top: 1px solid var(--border); }
    .social-icons { display: flex; justify-content: center; gap: 30px; margin-top: 15px; flex-wrap: wrap; }
    .social-link { text-decoration: none; color: var(--navy); font-weight: 600; font-size: 0.9rem; transition: color 0.3s; }
    .social-link:hover { color: var(--orange); }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1; }
      .contact-container { margin-top: 2rem; }
      .form-card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <div id="header"></div>
  <script src="header.js"></script>

  <section class="contact-hero">
    <h1>Contact Stranz</h1>
    <p>Reliable Logistics Solutions for Modern Business</p>
  </section>

  <main class="contact-container">
    <aside class="contact-sidebar">
      <div class="sidebar-item">
        <h3>📍 Corporate HQ</h3>
        <p>Stranz Logistics<br>Chennai, Tamil Nadu, India</p>
      </div>
      <div class="sidebar-item">
        <h3>📞 Direct Line</h3>
        <p><a href="tel:+919566952888">+91 95669 52888</a></p>
      </div>
      <div class="sidebar-item">
        <h3>✉️ Business Email</h3>
        <p><a href="mailto:info@stranz.in">info@stranz.in</a></p>
      </div>
      <div class="sidebar-item">
        <h3>⏰ Operations</h3>
        <p>Mon - Sat: 09:00 AM - 07:00 PM</p>
      </div>
    </aside>

    <div class="form-card">
      <h2>Request a Quote</h2>
      <!-- 
        WE ARE REMOVING THE JAVASCRIPT FETCH AND USING THE NATURAL FORM POST.
        THIS IS THE ONLY WAY TO PREVENT THE 404 ERROR.
      -->
      <form action="https://api.staticforms.xyz/submit" method="POST">
        
        <!-- REQUIRED: Your Access Key -->
        <input type="hidden" name="accessKey" value="sf_21df8be116a569a507f55266">
        
        <!-- REQUIRED: THE EXACT LINK TO YOUR PAGE -->
        <input type="hidden" name="redirectTo" value="https://stranz.in/thankyou.html">
        
        <div class="form-grid">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="name" placeholder="Enter your name" required>
          </div>
          <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" name="phone" placeholder="91XXXXXXXX" required>
          </div>
          <div class="form-group">
            <label>Pickup*</label>
            <input type="text" name="pick_up" placeholder="Pickup City" required>
          </div>
          <div class="form-group">
            <label>Drop-to*</label>
            <input type="text" name="drop_to" placeholder="Drop City" required>
          </div>
          <div class="form-group full-width">
            <label>Industry Segment *</label>
            <select name="industry" required>
              <option value="" disabled selected>Select Industry</option>
              <option value="FMCG">FMCG</option>
              <option value="Manufacturing">Manufacturing</option>
              <option value="Import & Export">Import & Export</option>
              <option value="E-commerce">E-commerce</option>
              <option value="Project Cargo">Project Cargo</option>
              <option value="Industrial Materials">Industrial Materials</option>
            </select>
          </div>
          <div class="form-group full-width">
            <label>Message / Load Details</label>
            <textarea name="message" rows="4" placeholder="Briefly describe your requirements..."></textarea>
          </div>
          <div class="full-width">
            <button type="submit" class="btn-submit" id="submitBtn">Submit Request</button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <div id="footer"></div>
  <script src="footer.js"></script>

  <script>
    // Simple script just to show "Sending..." feedback.
    // It does NOT interfere with the redirect.
    document.querySelector("form").addEventListener("submit", function() {
      const btn = document.getElementById("submitBtn");
      btn.innerText = "Sending Request...";
      btn.style.opacity = "0.7";
      btn.style.pointerEvents = "none";
    });
  </script>
<script>
  // We use 'onsubmit' directly on the form element for the fastest execution
  document.getElementById("stzContactForm").onsubmit = function() {
    try {
      // 1. Capture the data using the 'name' attribute of your inputs
      const details = {
        name: document.getElementsByName("name")[0].value,
        phone: document.getElementsByName("phone")[0].value,
        origin: document.getElementsByName("pick_up")[0].value,
        destination: document.getElementsByName("drop_to")[0].value,
        industry: document.getElementsByName("industry")[0].value,
        message: document.getElementsByName("message")[0].value
      };

      // 2. Save it immediately to LocalStorage
      localStorage.setItem('stranzInquiry', JSON.stringify(details));
      
      // 3. Optional: Visual feedback
      const btn = document.getElementById("submitBtn");
      if(btn) {
        btn.innerText = "Sending Request...";
        btn.style.opacity = "0.7";
      }
    } catch (err) {
      console.error("Storage Error:", err);
    }
    
    // Return true to allow the form to actually send the email via StaticForms
    return true; 
  };
</script>
</body>
</html>
