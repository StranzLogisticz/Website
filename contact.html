<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Stranz Logistics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <div id="header"></div>
  <script src="header.js"></script>

  <!-- Hero Banner -->
  <section class="contact-hero">
    <h1>Contact Us</h1>
    <p>We’re here to help you move forward</p>
  </section>

  <!-- Contact Info Cards (Clickable) -->
  <section class="contact-info">
    <a href="https://wa.me/919566952888" target="_blank" class="info-card">
      <h3>📞 Phone</h3>
      <p>+91 95669 52888</p>
    </a>
    <a href="mailto:info@stranz.in" class="info-card">
      <h3>✉️ Email</h3>
      <p>info@stranz.in</p>
    </a>
    <a href="https://maps.google.com/?q=Chennai+HQ+Tamil+Nadu+India" target="_blank" class="info-card">
      <h3>📍 Address</h3>
      <p>Chennai HQ, Tamil Nadu, India</p>
    </a>
  </section>

  <!-- Contact Form -->
  <section class="contact-form">
  <h2 class="section-title">Get in Touch</h2>

  <form action="https://formspree.io/f/xpqallzn" method="POST">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="email" placeholder="Your Email" required>
    <input type="text" name="company" placeholder="Company Name" required>
    <input type="tel" name="phone" placeholder="Phone Number" required>
    <textarea name="message" placeholder="Message" rows="5" required></textarea>

    <!-- Optional: Set email subject for the submission you’ll receive -->
    <input type="hidden" name="_subject" value="New inquiry from Stranz Contact Form">

    <!-- Redirect to your thank-you page after successful submit -->
    <input type="hidden" name="_redirect" value="https://website-ten-liard-40.vercel.app/thank-you.html">

    <button type="submit" class="btn-submit">Send Message</button>
  </form>

  <!-- Lightweight status text (Formspree will handle the redirect, but keep this in case) -->
  <p class="form-note">We typically reply within one business day.</p>
</section>
<!-- Social Ribbon -->
<section class="social-ribbon">
  <div class="ribbon-content">
    <h2>Follow us on</h2>
    <div class="social-icons">
      <a href="https://www.linkedin.com/company/stranz" target="_blank" class="social-link">🔗 LinkedIn</a>
      <a href="https://www.facebook.com/stranz" target="_blank" class="social-link">📘 Facebook</a>
      <a href="https://www.instagram.com/stranz" target="_blank" class="social-link">📸 Instagram</a>
      <a href="https://twitter.com/stranz" target="_blank" class="social-link">🐦 X</a>
    </div>
  </div>
</section>
  <!-- Footer -->
  <div id="footer"></div>
  <script src="footer.js"></script>

</body>
</html>
<!-- Redirecting -->
<script>
document.querySelector(".contact-form form").addEventListener("submit", async function(e) {
  e.preventDefault(); // stop default redirect
  const form = e.target;
  const data = new FormData(form);

  const response = await fetch(form.action, {
    method: form.method,
    body: data,
    headers: { 'Accept': 'application/json' }
  });

  if (response.ok) {
    window.location.href = "thank-you.html"; // force redirect to your page
  } else {
    alert("Oops! Something went wrong. Please try again.");
  }
});
</script>
